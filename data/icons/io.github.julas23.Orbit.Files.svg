<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Orbit-Files: a folder in Orbit's blues, its front carrying the mark's
       orbit and moon. Bold shapes and few of them, so it reads at 16 px. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6f9e"/>
      <stop offset="1" stop-color="#2b5579"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb6ea"/>
      <stop offset="1" stop-color="#4682b4"/>
    </linearGradient>
  </defs>
  <!-- The back, with its tab. -->
  <path d="M10 28a8 8 0 0 1 8-8h30l10 10h52a8 8 0 0 1 8 8v66a8 8 0 0 1-8 8H18a8 8 0 0 1-8-8z" fill="url(#back)"/>
  <!-- A sheet of paper peeking out. -->
  <rect x="22" y="34" width="84" height="40" rx="4" fill="#eceff4"/>
  <!-- The front. -->
  <path d="M10 50a8 8 0 0 1 8-8h92a8 8 0 0 1 8 8v54a8 8 0 0 1-8 8H18a8 8 0 0 1-8-8z" fill="url(#front)"/>
  <!-- The orbit and the moon. -->
  <circle cx="64" cy="78" r="16" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="64" cy="78" r="6" fill="#1b1f27"/>
  <circle cx="76" cy="66.5" r="6.5" fill="#ff9500" stroke="#4f8cc0" stroke-width="2"/>
</svg>
