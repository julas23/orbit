# Which portal does what in an Orbit session (XDG_CURRENT_DESKTOP=orbit):
# the screen (screencasts, screenshots) by xdg-desktop-portal-wlr, over
# orbit-core's wlr-screencopy; passwords by GNOME Keyring; the rest
# (files, settings, printing…) by the GTK one. Without this file the portal
# offers no screencast at all: wlr's says it is for wlroots desktops only.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
