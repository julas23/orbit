<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Orbit's mark in one colour (currentColor): the moon is cut out of the
       outer orbit so it still reads. -->
  <mask id="moon-cut">
    <rect width="100" height="100" fill="#fff"/>
    <circle cx="66.1" cy="84.4" r="10" fill="#000"/>
  </mask>
  <circle cx="50" cy="50" r="10" fill="currentColor"/>
  <circle cx="50" cy="50" r="24" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="100 50.8" transform="rotate(200 50 50)"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="6" mask="url(#moon-cut)"/>
  <circle cx="66.1" cy="84.4" r="6.5" fill="currentColor"/>
</svg>
