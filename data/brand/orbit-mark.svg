<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Orbit's mark ("Trilhas"), for dark backgrounds: a core, an open orbit
       around it, a closed orbit outside, and the moon on it. -->
  <circle cx="50" cy="50" r="10" fill="#4682b4"/>
  <circle cx="50" cy="50" r="24" fill="none" stroke="#6ea8e0" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="100 50.8" transform="rotate(200 50 50)"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#d8dee9" stroke-width="6"/>
  <circle cx="66.1" cy="84.4" r="6.5" fill="#ff9500"/>
</svg>
