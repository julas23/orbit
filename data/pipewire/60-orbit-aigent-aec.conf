# Orbit-Aigent's microphone without echo: the voice it says through the
# speakers (and anything else they play) taken out of what the microphone
# hears, by WebRTC's echo canceller in PipeWire's echo-cancel module. With
# monitor.mode the reference is what the speakers are sent, so nothing has
# to be played through a sink of its own.
#
# The orbit-aigent package puts it in /usr/share/pipewire/pipewire.conf.d/,
# scripts/install.sh in ~/.config/pipewire/pipewire.conf.d/; then
# `systemctl --user restart pipewire`. aigent.yaml's
# `microphone: orbit-aigent-mic` records it. To clean a microphone other
# than the default one, give capture.props a target.object, as
# `wpctl inspect <id>` names it (node.name).
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            # Whisper takes mono, and so does the echo canceller best.
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                # The quiet USB microphones raised, the room's hum and
                # what the speakers play taken out.
                webrtc.gain_control = true
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
            }
            capture.props = {
                node.name = "orbit-aigent-mic.capture"
                node.passive = true
            }
            source.props = {
                node.name = "orbit-aigent-mic"
                node.description = "Orbit-Aigent: microphone without echo"
                # Never chosen as the default source: other programs keep
                # the real microphone.
                priority.session = 1
                priority.driver = 1
            }
        }
    }
]
