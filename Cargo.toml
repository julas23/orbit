[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/julas23/orbit"
authors = ["Juliano <julianoas@gmail.com>"]

[workspace.dependencies]
orbit-common = { path = "crates/orbit-common" }
orbit-app = { path = "crates/orbit-app" }
orbit-backend-x11 = { path = "crates/orbit-backend-x11" }
orbit-backend-wayland = { path = "crates/orbit-backend-wayland" }

gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# Only to enable GLib 2.68 APIs (TimeZone::from_identifier); the code uses the
# copy re-exported as gtk::glib.
glib = { version = "0.22", features = ["v2_68"] }
gdk4-x11 = "0.11"
gdk4-wayland = "0.11"
gtk4-layer-shell = "0.8"
x11rb = "0.14"
gio-unix = "0.22"
glib-unix = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
# PulseAudio native protocol in pure Rust: no libpulse needed to build.
pulseaudio = "0.3"
# HTTP for the weather, pure Rust (rustls): no libsoup or curl needed.
ureq = "3"
# Translations (Project Fluent), pure Rust.
fluent-bundle = "0.16"
unic-langid = "0.9"
serde_yaml_ng = "0.10"
# orbit-clip: watching and setting the clipboard (wlr-data-control).
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["event", "pipe", "time"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
