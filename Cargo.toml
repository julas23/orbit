[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/julas23/orbit"
authors = ["Juliano <julianoas@gmail.com>"]

[workspace.dependencies]
orbit-common = { path = "crates/orbit-common" }
orbit-app = { path = "crates/orbit-app" }
orbit-backend-x11 = { path = "crates/orbit-backend-x11" }
orbit-backend-wayland = { path = "crates/orbit-backend-wayland" }
orbit-ipc = { path = "crates/orbit-ipc" }
orbit-protocols = { path = "crates/orbit-protocols" }

gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# Only to enable GLib 2.68 APIs (TimeZone::from_identifier); the code uses the
# copy re-exported as gtk::glib.
glib = { version = "0.22", features = ["v2_68"] }
gdk4-x11 = "0.11"
gdk4-wayland = "0.11"
gtk4-layer-shell = "0.8"
x11rb = "0.14"
gio-unix = "0.22"
glib-unix = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
# PulseAudio native protocol in pure Rust: no libpulse needed to build.
pulseaudio = "0.3"
# HTTP for the weather, pure Rust (rustls): no libsoup or curl needed.
ureq = "3"
# Translations (Project Fluent), pure Rust.
fluent-bundle = "0.16"
unic-langid = "0.9"
serde_yaml_ng = "0.10"
# orbit-clip and orbit-blink: the clipboard (wlr-data-control) and screen
# capture (wlr-screencopy).
wayland-client = "0.31"
# orbit-protocols: Orbit's own protocols (orbit-greet-v1), generated for
# the core (the same wayland-server Smithay uses) and its clients.
wayland-server = "0.31"
wayland-scanner = "0.31"
# orbit-greet: its own queue on GDK's Wayland connection (libwayland's).
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["event", "pipe", "time", "fs"] }
# orbit-view: image decoding in a sandbox, the engine of GNOME's Loupe. The
# 2.x series reads the loaders Debian 13 ships (glycin-loaders 1.x, the
# "1+" set); it brings its own copy of gio 0.20, used only to name files for
# it. gufo and chrono read the EXIF it hands back.
glycin = "=2.1.4"
gio20 = { package = "gio", version = "0.20" }
async-io = "2"
gufo-common = { version = "0.2", features = ["chrono"] }
gufo-exif = { version = "0.2", features = ["chrono"] }
chrono = { version = "0.4", default-features = false }
# orbit-read: PDF pages drawn by poppler (its GLib binding, on the same
# gtk-rs 0.22 as the rest), Markdown parsed by pulldown-cmark.
poppler-rs = "0.26"
pulldown-cmark = { version = "0.13", default-features = false }
# orbit-play: GStreamer's player, with the video drawn into GTK by the
# gtk4paintablesink element (built in, registered at start).
gst = { package = "gstreamer", version = "0.25" }
gst-play = { package = "gstreamer-play", version = "0.25" }
gst-plugin-gtk4 = { version = "0.15", features = ["wayland", "gtk_v4_14"] }
# orbit-edit: GtkSourceView 5 — highlighting, search, the minimap.
sourceview5 = { version = "0.11", features = ["v5_10"] }
# orbit-term: the terminal for interactive programs, VTE for GTK 4 from
# Debian (0.80 in trixie), on the same gtk-rs 0.11/0.22 as the rest.
vte4 = { version = "0.10", features = ["v0_80"] }
# orbit-pathfinder: the web engine, WebKitGTK 6.0 from Debian (2.52 in
# trixie), on the same gtk-rs 0.11/0.22 as the rest.
webkit6 = { version = "0.6", features = ["v2_48"] }
# orbit-pathfinder: importing saved passwords from other browsers — their
# SQLite stores, Chromium's AES-128-CBC with a PBKDF2 key, and Firefox's NSS
# (the system's libnss3, loaded at run time).
rusqlite = "0.37"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# orbit-prompter: the secret exchange of gcr's prompter protocol (DH,
# HKDF-SHA256, AES-128-CBC).
hkdf = "0.12"
sha2 = "0.10"
num-bigint = "0.4"
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
libloading = "0.8"
anyhow = "1"
# orbit-core: the criteria of sway commands ([app_id="(?i)…"]).
regex = "1"
# orbit-core: the compositor library, at an exact commit (its API changes
# between versions; updated on purpose, as with glycin). The commit the
# ported smallvil/anvil code was read at.
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "24647fc8d00131eb7f388efed26e35ea316b0018", default-features = false }
# orbit-core's DRM backend: connectors and monitor names (same commit).
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", rev = "24647fc8d00131eb7f388efed26e35ea316b0018" }
# orbit-core: the pointer's image, from the cursor theme.
xcursor = "0.3"
# orbit-core: org.freedesktop.ScreenSaver, the inhibitors of browsers and
# players (the series glycin already brings).
zbus = "5"
# The matrices of the renderer's shaders (the version Smithay uses).
glam = { version = "0.33", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
env_logger = "0.11"

# Smithay at the commit above, with one change: linux-dmabuf with feedback
# goes out at version 5, not 6 (see vendor/smithay/ORBIT.md).
[patch."https://github.com/Smithay/smithay.git"]
smithay = { path = "vendor/smithay" }
