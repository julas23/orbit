[package]
name = "orbit-edit"
description = "Orbit-Edit: a Rust + GTK4 text and code editor on GtkSourceView"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "editors"
priority = "optional"
extended-description = "Orbit-Edit: text editor. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
assets = [
    ["target/release/orbit-edit", "usr/bin/", "755"],
    ["../../data/io.github.julas23.Orbit.Edit.desktop", "usr/share/applications/", "644"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
sourceview5.workspace = true
