[package]
name = "orbit-calc"
description = "Orbit-Calc: a Rust + GTK4 calculator with standard and IPv4 subnet profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "utils"
priority = "optional"
extended-description = "Orbit-Calc: standard, scientific, HP-12C and IPv4 subnet calculator. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
assets = [
    ["target/release/orbit-calc", "usr/bin/", "755"],
    ["../../data/io.github.julas23.Orbit.Calc.desktop", "usr/share/applications/", "644"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
log.workspace = true
anyhow.workspace = true
