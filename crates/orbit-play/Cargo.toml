[package]
name = "orbit-play"
description = "Orbit-Play: a Rust + GTK4 video and audio player on GStreamer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "video"
priority = "optional"
extended-description = "Orbit-Play: audio and video player. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
recommends = "gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav, gstreamer1.0-pipewire"
# Flash movies.
suggests = "orbit-ruffle"
assets = [
    ["target/release/orbit-play", "usr/bin/", "755"],
    ["../../data/io.github.julas23.Orbit.Play.desktop", "usr/share/applications/", "644"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
log.workspace = true
anyhow.workspace = true
async-channel.workspace = true
gst.workspace = true
gst-play.workspace = true
gst-plugin-gtk4.workspace = true
