[package]
name = "orbit-prompter"
description = "Orbit-Prompter: the keyring's password prompts in Orbit's look, in place of gcr-prompter, Rust + GTK4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "x11"
priority = "optional"
extended-description = "Orbit-Prompter: asks for the password when an application opens a locked keyring or creates a new one, with the look of Orbit-Greet; it answers gnome-keyring as gcr-prompter does. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
recommends = "gnome-keyring"
assets = [
    ["target/release/orbit-prompter", "usr/bin/", "755"],
    ["../../data/dbus/org.gnome.keyring.SystemPrompter.service", "usr/share/dbus-1/services/", "644"],
]
maintainer-scripts = "debian/"

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
aes.workspace = true
cbc.workspace = true
hkdf.workspace = true
sha2.workspace = true
num-bigint.workspace = true
getrandom.workspace = true
zeroize = "1"
