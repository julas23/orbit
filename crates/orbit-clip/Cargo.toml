[package]
name = "orbit-clip"
description = "Orbit-Clip: a Rust + GTK4 clipboard history for Wayland and XWayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "utils"
priority = "optional"
extended-description = "Orbit-Clip: clipboard history for Wayland. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
assets = [
    ["target/release/orbit-clip", "usr/bin/", "755"],
    ["../../data/io.github.julas23.Orbit.Clip.desktop", "usr/share/applications/", "644"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true
rustix.workspace = true
