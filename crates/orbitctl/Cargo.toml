[package]
name = "orbitctl"
description = "orbitctl: commands and queries to Orbit-Core (and sway), as swaymsg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "admin"
priority = "optional"
extended-description = "orbitctl: commands for orbit-core over its sway-compatible IPC. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
assets = [
    ["target/release/orbitctl", "usr/bin/", "755"],
]

[dependencies]
orbit-ipc.workspace = true
serde_json.workspace = true
