[package]
name = "orbit-panel"
description = "Orbit-Panel: a Rust + GTK4 desktop panel, themeable with CSS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "x11"
priority = "optional"
extended-description = "Orbit-Panel: the Orbit desktop panel. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
recommends = "upower, network-manager, pipewire-pulse, bluez, ddcutil, fonts-noto-color-emoji"
assets = [
    ["target/release/orbit-panel", "usr/bin/", "755"],
    ["../../scripts/orbit-session", "usr/bin/", "755"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
gio-unix.workspace = true
glib.workspace = true
glib-unix.workspace = true
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
pulseaudio.workspace = true
ureq.workspace = true
