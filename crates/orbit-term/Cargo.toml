[package]
name = "orbit-term"
description = "Orbit-Term: a terminal with the prompt fixed on top, outputs that never wrap, and a history of them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "utils"
priority = "optional"
extended-description = "Orbit-Term: terminal with the prompt on top and outputs that never wrap. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
recommends = "git, bash-completion"
assets = [
    ["target/release/orbit-term", "usr/bin/", "755"],
    ["../../data/io.github.julas23.Orbit.Term.desktop", "usr/share/applications/", "644"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
vte4.workspace = true
log.workspace = true
anyhow.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = ["pty", "termios", "process"] }
