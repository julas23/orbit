[package]
name = "orbit-view"
description = "Orbit-View: a Rust + GTK4 image viewer, with sandboxed decoding (glycin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "graphics"
priority = "optional"
extended-description = "Orbit-View: image viewer. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto, glycin-loaders, bubblewrap"
assets = [
    ["target/release/orbit-view", "usr/bin/", "755"],
    ["../../data/io.github.julas23.Orbit.View.desktop", "usr/share/applications/", "644"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
log.workspace = true
anyhow.workspace = true
serde.workspace = true
async-channel.workspace = true
glycin.workspace = true
gio20.workspace = true
async-io.workspace = true
gufo-common.workspace = true
gufo-exif.workspace = true
chrono.workspace = true
