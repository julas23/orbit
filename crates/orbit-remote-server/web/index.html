<!doctype html>
<!-- Orbit-Remote: the browser client of orbit-remote-server (phase 1, the
     mirror). Served by the server itself; the pairing code shows on the
     server's screen. The video and the sound come over WebRTC, played with
     as little buffering as the browser allows; the mouse, the keys and the
     gamepads (the Gamepad API's standard ones, as Xbox 360 controllers the
     server makes in the session) go back on the server's data channels in
     the same connection: `input`, reliable, and `motion`, for positions,
     never sent twice (the WebSocket until they are open). Full screen (the button, or F11) holds the keyboard too,
     so the browser's own shortcuts reach the remote session. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Remote</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --fg: #e8eaf0; --dim: #8a90a0; --accent: #4f8cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  #pair { position: fixed; inset: 0; display: grid; place-items: center; }
  #pair form { display: grid; gap: 12px; padding: 24px; width: min(320px, calc(100% - 32px)); }
  #pair h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #pair p { margin: 0; color: var(--dim); }
  #pair input { font: 28px/1 ui-monospace, monospace; letter-spacing: 8px; text-align: center; padding: 10px; border-radius: 8px;
                border: 1px solid #2a2f3a; background: #141821; color: var(--fg); }
  #pair button { padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: white; font-size: 15px; cursor: pointer; }
  #error { color: #ff6b6b; min-height: 1.4em; }
  /* The remote pointer is in the picture: the local one hidden over it. */
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: black; display: none; cursor: none; }
  #stats { position: fixed; right: 8px; bottom: 8px; padding: 4px 8px; border-radius: 6px; background: #000a; color: var(--dim);
           font: 12px ui-monospace, monospace; display: none; align-items: center; gap: 8px; }
  #stats button { padding: 2px 8px; border: 0; border-radius: 4px; background: #2a2f3a; color: var(--fg); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="pair">
  <form id="form">
    <h1>Orbit Remote</h1>
    <p>Type the code shown on the computer's screen.</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus>
    <button>Connect</button>
    <div id="error"></div>
  </form>
</div>
<video id="video" autoplay muted playsinline></video>
<div id="stats"><span id="numbers"></span><button id="full" title="Full screen, with the keyboard">⛶</button></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let ws, pc;
// The video and the sound, as their tracks come, in one stream.
const media = new MediaStream();

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  $("error").textContent = "";
  connect($("code").value.trim());
});

function connect(code) {
  ws = new WebSocket(`ws://${location.host}/ws`);
  // The screen in device pixels: a server serving virtual monitors makes
  // one of this size.
  const screen_ = { width: Math.round(screen.width * devicePixelRatio), height: Math.round(screen.height * devicePixelRatio), rate: 60 };
  ws.onopen = () => ws.send(JSON.stringify({ type: "pair", code, screen: screen_ }));
  ws.onclose = () => { if (!pc) $("error").textContent = "The connection closed."; };
  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "refused") {
      $("error").textContent = "Wrong code.";
    } else if (msg.type === "locked") {
      $("error").textContent = "The session is locked: unlock it at the computer, then type the code it shows.";
    } else if (msg.type === "busy") {
      $("error").textContent = "Another client is using the session.";
    } else if (msg.type === "offer") {
      await start();
      await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: "answer", sdp: answer.sdp }));
    } else if (msg.type === "ice" && pc) {
      await pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: msg.sdpMLineIndex });
    }
  };
}

async function start() {
  if (pc) return;
  // On the LAN: host candidates only, no STUN.
  pc = new RTCPeerConnection({ iceServers: [] });
  pc.onicecandidate = (e) => {
    if (e.candidate) ws.send(JSON.stringify({ type: "ice", candidate: e.candidate.candidate, sdpMLineIndex: e.candidate.sdpMLineIndex }));
  };
  pc.ondatachannel = (e) => { channels[e.channel.label] = e.channel; };
  pc.ontrack = (e) => {
    // As little buffering as the browser allows (Chrome: playoutDelayHint;
    // the standard: jitterBufferTarget).
    if ("playoutDelayHint" in e.receiver) e.receiver.playoutDelayHint = 0;
    if ("jitterBufferTarget" in e.receiver) e.receiver.jitterBufferTarget = 0;
    media.addTrack(e.track);
    if (e.track.kind !== "video") return;
    const v = $("video");
    v.srcObject = media;
    // With its sound: the code typed was the click a browser wants for
    // that; one that still refuses plays muted until the next click.
    v.muted = false;
    v.play().catch(() => {
      v.muted = true;
      v.play();
      v.addEventListener("pointerdown", () => { v.muted = false; }, { once: true });
    });
    $("pair").style.display = "none";
    $("video").style.display = "block";
    $("stats").style.display = "flex";
    stats(e.receiver);
    input();
    gamepads();
  };
}

// Frames a second, and the jitter buffer's delay, now and then.
function stats(receiver) {
  let last, rtt = "–";
  setInterval(async () => {
    const report = await receiver.getStats();
    report.forEach((s) => {
      if (s.type !== "inbound-rtp") return;
      if (last) {
        const dt = (s.timestamp - last.timestamp) / 1000;
        const fps = (s.framesDecoded - last.framesDecoded) / dt;
        const jitter = s.jitterBufferEmittedCount > last.jitterBufferEmittedCount
          ? 1000 * (s.jitterBufferDelay - last.jitterBufferDelay) / (s.jitterBufferEmittedCount - last.jitterBufferEmittedCount) : 0;
        const decode = s.framesDecoded > last.framesDecoded
          ? 1000 * (s.totalDecodeTime - last.totalDecodeTime) / (s.framesDecoded - last.framesDecoded) : 0;
        $("numbers").textContent = `${s.frameWidth}×${s.frameHeight} · ${fps.toFixed(0)} fps · buffer ${jitter.toFixed(0)} ms · decode ${decode.toFixed(1)} ms · rtt ${rtt}`;
      }
      last = s;
    });
    // The way there and back, from the connection in use.
    const all = await pc.getStats();
    all.forEach((s) => {
      if (s.type === "candidate-pair" && s.nominated && s.currentRoundTripTime !== undefined) rtt = `${(1000 * s.currentRoundTripTime).toFixed(1)} ms`;
    });
  }, 1000);
}

// The server's data channels, by label, as they come.
const channels = {};
const open = (label) => (channels[label] && channels[label].readyState === "open" ? channels[label] : null);
// Each pointer's and pad's count and last position (orbit-remote-server's
// `lanes`): a late position is dropped by its number, and once still for
// REST ms the last one goes again, reliably.
const REST = 50;
const streams = {};
const stream = (key) => (streams[key] = streams[key] || { seq: 0, last: null, axes: {}, timer: 0 });

function send(msg) {
  let fast = false, key = null;
  if (msg.type === "move") {
    key = "pointer";
    const s = stream(key);
    msg.seq = ++s.seq;
    s.last = msg;
    fast = true;
  } else if (msg.type === "button") {
    msg.seq = stream("pointer").seq;
  } else if (msg.type === "pad-input") {
    key = `pad ${msg.id}`;
    const s = stream(key);
    msg.seq = ++s.seq;
    for (const [type, code, value] of msg.events) if (type === EV_ABS) s.axes[code] = value;
    fast = msg.events.every((e) => e[0] === EV_ABS);
  } else if (msg.type === "pad-gone") {
    delete streams[`pad ${msg.id}`];
  }
  const text = JSON.stringify(msg);
  const motion = fast && open("motion"), input = open("input");
  if (motion) {
    motion.send(text);
    const s = streams[key];
    clearTimeout(s.timer);
    s.timer = setTimeout(() => rest(key), REST);
  } else if (input) {
    input.send(text);
  } else if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(text);
  }
}

// Still: where it stopped, again on `input`.
function rest(key) {
  const s = streams[key], input = open("input");
  if (!s || !input) return;
  if (key === "pointer") {
    if (s.last) input.send(JSON.stringify(s.last));
  } else {
    const events = Object.entries(s.axes).map(([code, value]) => [EV_ABS, Number(code), value]);
    input.send(JSON.stringify({ type: "pad-input", id: Number(key.slice(4)), events, seq: s.seq }));
  }
}

// Where on the remote screen a point of the page is, as fractions of it:
// the picture is letterboxed (object-fit: contain).
function place(e) {
  const v = $("video");
  const scale = Math.min(v.clientWidth / v.videoWidth, v.clientHeight / v.videoHeight);
  const w = v.videoWidth * scale, h = v.videoHeight * scale;
  const left = (v.clientWidth - w) / 2, top = (v.clientHeight - h) / 2;
  return { x: (e.clientX - left) / w, y: (e.clientY - top) / h };
}

function input() {
  const v = $("video");
  v.addEventListener("pointermove", (e) => {
    if (!v.videoWidth) return;
    // All the moves since the last event, not only the last one.
    const moves = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const m of moves.length ? moves : [e]) send({ type: "move", ...place(m) });
  });
  v.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    v.setPointerCapture(e.pointerId);
    send({ type: "button", button: e.button, down: true, ...place(e) });
  });
  v.addEventListener("pointerup", (e) => {
    e.preventDefault();
    send({ type: "button", button: e.button, down: false, ...place(e) });
  });
  v.addEventListener("contextmenu", (e) => e.preventDefault());
  v.addEventListener("wheel", (e) => {
    e.preventDefault();
    // Lines or pages as pixels, about as the browser scrolls them.
    const unit = e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 800 : 1;
    send({ type: "wheel", dx: e.deltaX * unit, dy: e.deltaY * unit });
  }, { passive: false });
  // Keys by their place; the remote session repeats them itself. Those
  // still down when the tab is left are let go.
  const held = new Set();
  const key = (down) => (e) => {
    if (e.target.tagName === "INPUT") return;
    e.preventDefault();
    if (down && e.repeat) return;
    if (down) held.add(e.code); else held.delete(e.code);
    send({ type: "key", code: e.code, down });
  };
  window.addEventListener("keydown", key(true));
  window.addEventListener("keyup", key(false));
  window.addEventListener("blur", () => {
    held.forEach((code) => send({ type: "key", code, down: false }));
    held.clear();
  });
  $("full").addEventListener("click", async () => {
    if (document.fullscreenElement) return document.exitFullscreen();
    await document.documentElement.requestFullscreen();
    // Chrome: in full screen the keyboard can be held, Esc and all (hold
    // Esc to leave).
    if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(() => {});
  });
}
// The Gamepad API's standard pad as evdev's Xbox 360 controller (the
// kernel's xpad), so games and Steam take it for one.
const BTN = { A: 0x130, B: 0x131, X: 0x133, Y: 0x134, TL: 0x136, TR: 0x137, SELECT: 0x13a, START: 0x13b, MODE: 0x13c, THUMBL: 0x13d, THUMBR: 0x13e };
// The standard buttons by index; 6 and 7 (the triggers) and 12…15 (the
// pad's arrows) are axes there.
const BUTTONS = { 0: BTN.A, 1: BTN.B, 2: BTN.X, 3: BTN.Y, 4: BTN.TL, 5: BTN.TR, 8: BTN.SELECT, 9: BTN.START, 10: BTN.THUMBL, 11: BTN.THUMBR, 16: BTN.MODE };
const ABS = { X: 0, Y: 1, Z: 2, RX: 3, RY: 4, RZ: 5, HAT0X: 0x10, HAT0Y: 0x11 };
const EV_KEY = 1, EV_ABS = 3;
const STICK = { min: -32768, max: 32767, fuzz: 16, flat: 128 };
const XBOX360 = {
  type: "pad", name: "Microsoft X-Box 360 pad", bus: 3, vendor: 0x045e, product: 0x028e, version: 0x0114,
  keys: Object.values(BTN),
  axes: [
    { code: ABS.X, ...STICK }, { code: ABS.Y, ...STICK }, { code: ABS.RX, ...STICK }, { code: ABS.RY, ...STICK },
    { code: ABS.Z, min: 0, max: 255 }, { code: ABS.RZ, min: 0, max: 255 },
    { code: ABS.HAT0X, min: -1, max: 1 }, { code: ABS.HAT0Y, min: -1, max: 1 },
  ],
};

// A standard pad's state as evdev's events, by "type:code".
function padState(g) {
  const state = {};
  const pressed = (i) => (g.buttons[i] && g.buttons[i].pressed ? 1 : 0);
  for (const [i, code] of Object.entries(BUTTONS)) state[`${EV_KEY}:${code}`] = pressed(i);
  const stick = (v) => Math.max(-32768, Math.min(32767, Math.round((v || 0) * 32767)));
  [ABS.X, ABS.Y, ABS.RX, ABS.RY].forEach((code, i) => { state[`${EV_ABS}:${code}`] = stick(g.axes[i]); });
  const trigger = (i) => Math.round(255 * (g.buttons[i] ? g.buttons[i].value : 0));
  state[`${EV_ABS}:${ABS.Z}`] = trigger(6);
  state[`${EV_ABS}:${ABS.RZ}`] = trigger(7);
  state[`${EV_ABS}:${ABS.HAT0X}`] = pressed(15) - pressed(14);
  state[`${EV_ABS}:${ABS.HAT0Y}`] = pressed(13) - pressed(12);
  return state;
}

// Read every frame (the API has no events for its buttons); only what
// changed goes. A pad the browser does not map as standard is left out.
function gamepads() {
  if (!navigator.getGamepads) return;
  const known = new Map();
  window.addEventListener("gamepaddisconnected", (e) => {
    if (known.delete(e.gamepad.index)) send({ type: "pad-gone", id: e.gamepad.index });
  });
  const look = () => {
    for (const g of navigator.getGamepads()) {
      if (!g || g.mapping !== "standard") continue;
      const state = padState(g);
      let before = known.get(g.index);
      if (!before) {
        send({ ...XBOX360, id: g.index });
        before = {};
        known.set(g.index, before);
      }
      const events = [];
      for (const [k, v] of Object.entries(state)) {
        if (before[k] === v) continue;
        const [type, code] = k.split(":").map(Number);
        events.push([type, code, v]);
        before[k] = v;
      }
      if (events.length) send({ type: "pad-input", id: g.index, events });
    }
    requestAnimationFrame(look);
  };
  requestAnimationFrame(look);
}
</script>
</body>
</html>
