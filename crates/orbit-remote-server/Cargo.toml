[package]
name = "orbit-remote-server"
description = "Orbit-Remote-Server: the session, shared over the network (WebRTC), for a browser or orbit-local-station"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "net"
priority = "optional"
extended-description = "Orbit-Remote-Server: shares an Orbit session over the network. It captures the screen as it changes (orbit-core's screen copies), encodes it on the GPU (VA-API, or NVENC on NVIDIA) and sends it over WebRTC to a browser, which pairs with a code shown on the screen. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-nice, libnotify-bin"
recommends = "mesa-va-drivers"
assets = [
    ["target/release/orbit-remote-server", "usr/bin/", "755"],
]

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
wayland-protocols-misc.workspace = true
gbm.workspace = true
rustix.workspace = true
gst.workspace = true
gst-app.workspace = true
gst-video.workspace = true
gst-allocators.workspace = true
gst-webrtc.workspace = true
gst-sdp.workspace = true
tungstenite.workspace = true
serde_json.workspace = true
orbit-ipc.workspace = true
getrandom.workspace = true
sha2.workspace = true
