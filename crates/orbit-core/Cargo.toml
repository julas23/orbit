[package]
name = "orbit-core"
description = "Orbit-Core: the Wayland compositor of the Orbit desktop, on Smithay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "x11"
priority = "optional"
extended-description = "Orbit-Core: the Wayland compositor of the Orbit desktop. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
recommends = "xwayland, orbit-panel, orbit-dock, orbit-notify, orbitctl"
assets = [
    ["target/release/orbit-core", "usr/bin/", "755"],
    ["../../data/orbit.desktop", "usr/share/wayland-sessions/", "644"],
]

[dependencies]
smithay = { workspace = true, features = ["backend_winit", "backend_egl", "backend_drm", "backend_gbm", "backend_libinput", "backend_udev", "backend_session_libseat", "renderer_gl", "wayland_frontend", "desktop", "use_system_lib", "xwayland"] }
tracing.workspace = true
orbit-ipc.workspace = true
orbit-protocols = { workspace = true, features = ["server"] }
serde_json.workspace = true
regex.workspace = true
smithay-drm-extras.workspace = true
xcursor.workspace = true
glam.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
anyhow.workspace = true
zbus.workspace = true
pangocairo.workspace = true
