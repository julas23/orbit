[package]
name = "orbit-notify"
description = "Orbit-Notify: the desktop's notification server — bubbles, a notification centre and the panel's counter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "x11"
priority = "optional"
extended-description = "Orbit-Notify: the Orbit notification server. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
# Any desktop notification daemon will do for blueman and the like.
provides = "notification-daemon"
assets = [
    ["target/release/orbit-notify", "usr/bin/", "755"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
gio-unix.workspace = true
