[package]
name = "orbit-read"
description = "Orbit-Read: a Rust + GTK4 reader for PDF (poppler), Markdown and plain text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "text"
priority = "optional"
extended-description = "Orbit-Read: text, Markdown and PDF reader. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
assets = [
    ["target/release/orbit-read", "usr/bin/", "755"],
    ["../../data/io.github.julas23.Orbit.Read.desktop", "usr/share/applications/", "644"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
log.workspace = true
anyhow.workspace = true
poppler-rs.workspace = true
pulldown-cmark.workspace = true
