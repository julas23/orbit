[package]
name = "orbit-files"
description = "Orbit-Files: a Rust + GTK4 file manager — Yazi's speed, the best of the desktop ones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.deb]
maintainer = "Juliano <julianoas@gmail.com>"
section = "utils"
priority = "optional"
extended-description = "Orbit-Files: file manager. Part of the Orbit desktop (https://github.com/julas23/orbit)."
depends = "$auto"
recommends = "gvfs-backends, gvfs-fuse, ffmpegthumbnailer, udisks2, p7zip-full, unzip, zip"
assets = [
    ["target/release/orbit-files", "usr/bin/", "755"],
    ["../../data/io.github.julas23.Orbit.Files.desktop", "usr/share/applications/", "644"],
]

[dependencies]
orbit-app.workspace = true
orbit-common.workspace = true
gtk.workspace = true
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
async-channel.workspace = true
sourceview5.workspace = true
poppler-rs.workspace = true
regex = "1"
