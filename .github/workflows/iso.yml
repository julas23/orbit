# The Orbit Linux ISO, on demand: live-build in a privileged debian:trixie
# container (distro/iso/build.sh), Orbit's packages from the public
# repository. The ISO and its .sha256 are kept as the run's artifact;
# publishing it on rationalazimuth.com/orbit stays a step by hand.
name: iso

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test image: the installer asks nothing (for a VM only)"
        type: choice
        options: ["", "1", "luks", "keep"]
        default: ""

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # live-build's chroot, its cache and the image take ~15 GB; the
      # runner's preinstalled toolchains are not needed.
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        env:
          ORBIT_ISO_TEST: ${{ inputs.test }}
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" -e ORBIT_ISO_TEST \
            debian:trixie sh -euc '
              apt-get update -qq
              apt-get install -y -qq live-build git rsync ca-certificates >/dev/null
              git config --global --add safe.directory /src
              /src/distro/iso/build.sh /src/out'
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 7
