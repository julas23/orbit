label installstart
	menu label ^Install Orbit Linux
	linux @KERNEL_DI@
	initrd @INITRD_DI@
	append vga=788 @APPEND_INSTALL@ --- quiet

menu begin advanced
	menu label ^Advanced options
	menu title Advanced options
	include stdmenu.cfg
	label live-medium
		menu label Orbit Linux Live, read from the boot medium
		linux /live/vmlinuz
		initrd /live/initrd.img
		append @APPEND_LIVE@
	label live-safe
		menu label Orbit Linux Live, safe graphics
		linux /live/vmlinuz
		initrd /live/initrd.img
		append @APPEND_LIVE@ toram nomodeset
	label expert
		menu label Install Orbit Linux, every question asked
		linux @KERNEL_DI@
		initrd @INITRD_DI@
		append priority=low vga=788 @APPEND_INSTALL@
	label rescue
		menu label Rescue an installed system
		linux @KERNEL_DI@
		initrd @INITRD_DI@
		append rescue/enable=true vga=788 @APPEND_INSTALL@ --- quiet
	label back
		menu label ^Back
		menu exit
menu end
