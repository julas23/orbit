source /boot/grub/config.cfg

# Read from the boot medium: copying the whole image to RAM first (toram)
# held the boot for a minute or more on a USB stick; it is under Advanced.
menuentry "Orbit Linux Live" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

if @ENABLE_INSTALL_MENU@; then
	source /boot/grub/install_start.cfg
fi

submenu "Advanced options" --hotkey=a {
	source /boot/grub/theme.cfg

	menuentry "Orbit Linux Live, copied to RAM (the medium can be removed)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
		initrd	@INITRD_LIVE@
	}
	menuentry "Orbit Linux Live, safe graphics" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
		initrd	@INITRD_LIVE@
	}
	if @ENABLE_INSTALL_MENU@; then
		source /boot/grub/install.cfg
	fi
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Check the boot medium" {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Firmware settings" {
			fwsetup
		}
	fi
}
