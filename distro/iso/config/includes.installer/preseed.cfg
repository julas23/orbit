# Orbit Linux's installer: debian-installer copying the Live image
# (docs/PLANO-DISTRO.md §6.2). Asked: user, password, hostname, the disk and
# the last confirmation; the rest is decided here, in /orbit/early.sh
# (partitioning, boot loader) and in /orbit/late.sh (btrfs subvolumes,
# systemd-boot with UKIs, snapper, what only the Live has).

# Language, keyboard and time: the Live's (Brazil, for now).
d-i debian-installer/language string pt_BR
d-i debian-installer/country string BR
d-i debian-installer/locale string pt_BR.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8, pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i time/zone string America/Sao_Paulo
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Network: the hostname is asked, with orbit offered.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string orbit
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true

# No root password: the user gets sudo.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string

# Everything comes from the Live image; apt is set up by late.sh.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean false
d-i tasksel/first multiselect
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

# Disk: GPT, the recipe early.sh writes for the disk's size and the RAM.
d-i partman/early_command string sh /orbit/early.sh
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
# The method is asked: "use the entire disk" takes the recipe, "manual" keeps
# an existing /home.
d-i partman-auto/choose_recipe select orbit
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-efi/non_efi_system boolean true
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

# The end: our steps, then the reboot.
d-i preseed/late_command string sh /orbit/late.sh
d-i finish-install/reboot_in_progress note
