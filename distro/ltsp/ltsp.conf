# /etc/ltsp/ltsp.conf — LTSP's settings for Orbit's network-booted stations
# (distro/ltsp/, installed by build-station-image.sh; `ltsp initrd` after a
# change). The station image alone is served; what a station shows is
# orbit-local-station, so LTSP's own logins (SSHFS homes, the display
# manager) are not used.
# See ltsp.conf(5).

[server]
# The iPXE menu waits this long (ms) before booting the default image.
MENU_TIMEOUT=2000
# The station's squashfs image. Without it the menu's default is the CPU's
# name (x86_64), which no item has, and iPXE took the raw chroot entry.
DEFAULT_IMAGE=orbit-station

[clients]
# LTSP gives a client the server's users and drops the image's own ones
# (its pwmerge): a station wants neither the server's users nor to lose
# `station`, whose console logs straight into orbit-local-station (it
# shares uid 1000 with the server's first user and was dropped). No
# server user imported (a name that matches none), `station` kept.
PWMERGE_SUR="^$"
PWMERGE_DUR="^station$"
# LTSP switches the clients' SSH server off; a station has one only when
# its image was built with STATION_SSH_KEY, to be looked into.
KEEP_SYSTEM_SERVICES="ssh"
