# Orbit-Panel — ~/.config/orbit/panel.yaml. Every key is optional.

edge: left          # left | right | top | bottom
size: 150           # thickness in logical pixels
monitor: 0          # index, or an output name such as HDMI-A-1
reserve: true       # keep tiled windows out of the panel's area
maintenance: false  # true draws the 5 px layout grid behind the panel

# Modules, in order. Listing a module turns it on; its options live in
# modules/<name>.yaml (optional — defaults apply without it).
start:              # top of a vertical panel, left of a horizontal one
  - menu
  - windows
center: []
end:                # bottom / right
  - clock
  - calendar
  - weather
  - forecast
  - tray
  - brightness
  - volume
  - workspaces
  - network
  - keyboard
  - battery
  - session
