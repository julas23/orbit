# Orbit-Panel in maintenance mode on the secondary monitor:
#
#   ./target/release/orbit-panel --config examples/maintenance
#
# Draws the grid behind the panel: 30 px cells named a1 … d27.
# A module takes its default size, or the one given: `- clock: mini`.

edge: left
size: 154
monitor: HDMI-A-1   # output name (see `swaymsg -t get_outputs`) or an index
maintenance: true

start:
  - menu
  - windows
end:
  - clock
  - calendar
  - weather
  - tray
  - volume: mini
  - brightness: mini
  - network: mini
  - keyboard: mini
  - battery: mini
  - notifications: mini
  - bluetooth: mini
  - monitors: mini
  - workspaces
  - session
