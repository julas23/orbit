# Orbit-Panel in maintenance mode on the secondary monitor.
#
#   ./target/release/orbit-panel --config examples/maintenance.yaml
#
# Draws the 5 px layout grid behind the panel. The dock stays off.

panel:
  edge: left
  size: 150
  monitor: HDMI-A-1   # output name (see `swaymsg -t get_outputs`) or an index
  maintenance: true
  menu:
    command: rofi -show drun
    icon: /usr/share/pixmaps/debian-logo.png
    tooltip: Applications

dock:
  enabled: false
